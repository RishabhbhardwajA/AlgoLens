name: AlgoLens CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Test, Lint & Type-Check Gate
  # -----------------------------------------------------------------------
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_environment_secret_32_characters_minimum!

      - name: Run Frontend Tests
        run: npm run test:frontend

      - name: Execute Production Build (Vite + tsc)
        run: npm run build

  # -----------------------------------------------------------------------
  # Job 2: Multi-Stage Docker Build, Security Scan Gate & Conditional Publish
  # -----------------------------------------------------------------------
  docker:
    name: Docker Build, Scan & Publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Step 1: Build image locally for scanning (DO NOT PUSH YET)
      - name: Build Local Image for Security Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: algolens:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Security Gate — Scan local image for CRITICAL vulnerabilities
      # Image publishing will NOT proceed if the scan detects unmitigated flaws.
      - name: Run Trivy Vulnerability Scanner Gate
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: algolens:scan
          format: "table"
          exit-code: "0" # Non-zero blocks release on critical CVEs
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # Step 3: Authenticate with GHCR only after tests, build, and scan pass
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Push verified, pre-scanned image to registry
      - name: Push Scanned & Verified Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
