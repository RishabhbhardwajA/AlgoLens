name: AlgoLens CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Test, Lint & Type-Check Gate
  # Read-only permissions; runs frontend/backend tests and builds.
  # -----------------------------------------------------------------------
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js LTS (v22)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java OpenJDK 21 (for tracer verification)
        uses: actions/setup-java@8df1039502a1530b92330a84245d672d522f2902 # v4.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_environment_secret_32_characters_minimum!

      - name: Run Frontend Tests
        run: npm run test:frontend

      - name: Execute Production Build (Vite + tsc + tracer)
        run: npm run build

  # -----------------------------------------------------------------------
  # Job 2: Multi-Stage Docker Build, Export & Security Scan Gate
  # Builds both application and isolated worker images, exports immutable
  # tarballs, and enforces Trivy exit-code: 1 gate on HIGH/CRITICAL CVEs.
  # Operates with strictly read-only permissions.
  # -----------------------------------------------------------------------
  docker-scan:
    name: Docker Build & Security Scan Gate
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Step 1A: Build main application container image locally
      - name: Build Main Application Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          tags: algolens:scan
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # Step 1B: Build dedicated Java execution worker image locally
      - name: Build Java Worker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: algolens-worker:scan
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Step 2: Export exact images to immutable archives
      - name: Export Container Image Archives
        run: |
          mkdir -p /tmp/images
          docker save -o /tmp/images/algolens-app.tar algolens:scan
          docker save -o /tmp/images/algolens-worker.tar algolens-worker:scan

      # Step 3A: Security Gate — Scan Main App image for CRITICAL and HIGH CVEs
      - name: Run Trivy Vulnerability Scanner Gate (App Image)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          input: /tmp/images/algolens-app.tar
          format: "table"
          exit-code: "1" # Non-zero blocks release on CRITICAL or HIGH CVEs
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # Step 3B: Security Gate — Scan Java Worker image for CRITICAL and HIGH CVEs
      - name: Run Trivy Vulnerability Scanner Gate (Worker Image)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          input: /tmp/images/algolens-worker.tar
          format: "table"
          exit-code: "1" # Non-zero blocks release on CRITICAL or HIGH CVEs
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      # Step 4: Upload scanned & verified image archives only after Trivy passes
      - name: Upload Scanned Image Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: algolens-scanned-images
          path: /tmp/images/
          retention-days: 1

  # -----------------------------------------------------------------------
  # Job 3: Dedicated GHCR Publishing
  # Downloads the exact scanned artifacts from Job 2; tags & pushes without rebuilding.
  # Isolated job with packages:write; runs ONLY on main branch after validate & scan pass.
  # -----------------------------------------------------------------------
  publish:
    name: Publish Container Images to GHCR
    needs: [validate, docker-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Scanned Image Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: algolens-scanned-images
          path: /tmp/images

      - name: Load Verified Image Archives
        run: |
          docker load -i /tmp/images/algolens-app.tar
          docker load -i /tmp/images/algolens-worker.tar

      - name: Extract Docker Metadata (App Tags & Labels)
        id: meta-app
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract Docker Metadata (Worker Tags & Labels)
        id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Scanned App Image Artifact
        run: |
          for tag in ${{ steps.meta-app.outputs.tags }}; do
            echo "Tagging and pushing App Image: $tag"
            docker tag algolens:scan "$tag"
            docker push "$tag"
          done

      - name: Tag and Push Scanned Worker Image Artifact
        run: |
          for tag in ${{ steps.meta-worker.outputs.tags }}; do
            echo "Tagging and pushing Worker Image: $tag"
            docker tag algolens-worker:scan "$tag"
            docker push "$tag"
          done
