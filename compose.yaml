# =========================================================================
# AlgoLens — Local & Production Docker Compose Configuration
# =========================================================================
# Runs the unified AlgoLens service (Express API + Vite SPA) with persistent
# SQLite storage, container healthchecks, and non-root execution.
#
# Quickstart:
#   1. Copy .env.example to .env and configure a secure JWT_SECRET:
#      openssl rand -base64 48
#   2. Start container:
#      docker compose up -d
#   3. View logs:
#      docker compose logs -f
# =========================================================================

services:
  algolens:
    build:
      context: .
      dockerfile: Dockerfile
    image: algolens:local
    container_name: algolens-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Load JWT_SECRET from local .env file or environment; do not commit secrets
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/app/backend/data/algolens.db
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    volumes:
      # Persistent named volume preserves SQLite user records, progress, and snippets across restarts
      - algolens-data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Isolated persistent volume for SQLite database storage
  algolens-data:
    name: algolens-sqlite-data
