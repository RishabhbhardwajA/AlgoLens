apiVersion: v1
kind: ConfigMap
metadata:
  name: algolens-config
  namespace: algolens
  labels:
    app.kubernetes.io/name: algolens
data:
  NODE_ENV: "production"
  PORT: "5000"
  DATABASE_PATH: "/data/algolens.db"
  CLIENT_URL: "http://localhost:5000"
  JAVA_TRACE_WORKER_URL: "http://algolens-java-worker:5050"
  ENABLE_JAVA_TRACING: "true"
