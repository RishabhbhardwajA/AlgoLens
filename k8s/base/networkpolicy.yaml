apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: algolens-worker-isolation-policy
  namespace: algolens
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: algolens-java-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming trace requests ONLY from AlgoLens application pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: algolens
              app.kubernetes.io/component: web-api
      ports:
        - protocol: TCP
          port: 5050
  egress:
    # Deny all external internet egress and cloud metadata access.
    # Allow only internal DNS resolution within kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
